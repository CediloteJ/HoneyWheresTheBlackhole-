<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celestial Radio Target Observation Planner</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

  <py-config>
    packages = ["numpy", "matplotlib", "astropy"]
  </py-config>

  <script>
    window.userLat = null;
    window.userLon = null;

    function initUserContext() {
      const dateInput = document.getElementById("dateTimeInput");
      if (dateInput) {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        dateInput.value = `${year}-${month}-${day}`;
      }

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            window.userLat = position.coords.latitude;
            window.userLon = position.coords.longitude;
            const term = document.getElementById("terminal-out");
            if (term) {
              term.innerText = `Location detected (${window.userLat.toFixed(2)}°, ${window.userLon.toFixed(2)}°). Select target and click calculate.`;
            }
          },
          (error) => {
            console.warn("Geolocation denied or unavailable.");
          }
        );
      }
    }

    window.addEventListener("DOMContentLoaded", initUserContext);
  </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">

  <div class="max-w-4xl mx-auto space-y-6">
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-bold text-yellow-400">Honey, where's the black hole?</h1>
      <p class="text-gray-400 text-sm">Dipole Array & Horizon Tracking for Deep Sky Radio Sources</p>
    </header>

    <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 flex flex-col items-center gap-6">
      <div class="flex flex-wrap items-center justify-center gap-6 w-full">
        <div class="flex items-center gap-2">
          <label for="targetSelect" class="font-medium text-gray-300 whitespace-nowrap">Target:</label>
          <select id="targetSelect" class="bg-gray-700 border border-gray-600 px-3 py-2 rounded text-white font-mono">
            <option value="Sgr A*">Sagittarius A* (Galactic Center SMBH)</option>
            <option value="M87*">M87* (Supermassive Black Hole)</option>
            <option value="Cyg A">Cygnus A (Radio Galaxy)</option>
            <option value="Tau A">Taurus A (Crab Nebula / Supernova Remnant)</option>
            <option value="Cas A">Cassiopeia A (Supernova Remnant)</option>
          </select>
        </div>

        <div class="flex items-center gap-2">
          <label for="dateTimeInput" class="font-medium text-gray-300 whitespace-nowrap">Date:</label>
          <input type="date" id="dateTimeInput" class="bg-gray-700 border border-gray-600 px-3 py-2 rounded text-white font-mono">
        </div>
      </div>

      <button id="path-btn" py-click="show_path" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-8 rounded-lg transition duration-200 shadow-md">
        Calculate Horizon Track
      </button>
    </div>

    <div class="bg-black p-6 rounded-xl border border-gray-800 font-mono text-green-400 shadow-2xl overflow-x-auto whitespace-pre">
      <div id="terminal-out">Detecting location... Select a target, date, and click 'Calculate Horizon Track'...</div>
    </div>

    <div class="space-y-6">
      <div id="plot1-out" class="w-full flex justify-center bg-gray-800 p-4 rounded-xl border border-gray-700"></div>
      <div id="plot2-out" class="w-full flex justify-center bg-gray-800 p-4 rounded-xl border border-gray-700"></div>
    </div>

    <div id="window-controls" class="hidden bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 space-y-4">
      <p class="text-gray-300 font-medium">Step 2: When will you actually be observing?</p>
      <div class="flex flex-col md:flex-row items-center gap-4">
        <label for="obsStartInput" class="font-medium text-gray-300 whitespace-nowrap w-40">Start (UTC):</label>
        <input type="text" id="obsStartInput" class="bg-gray-700 border border-gray-600 px-3 py-2 rounded text-white font-mono w-full">
      </div>
      <div class="flex flex-col md:flex-row items-center gap-4">
        <label for="obsEndInput" class="font-medium text-gray-300 whitespace-nowrap w-40">End (UTC):</label>
        <input type="text" id="obsEndInput" class="bg-gray-700 border border-gray-600 px-3 py-2 rounded text-white font-mono w-full">
      </div>
      <button id="optimize-btn" py-click="optimize_window" class="w-full md:w-auto bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2 px-6 rounded-lg transition duration-200">
        Calculate Best Wire Orientation
      </button>
    </div>
  </div>

  <script type="py">
import warnings
import datetime
import numpy as np
import matplotlib.pyplot as plt
import matplotlib.dates as mdates
from astropy.coordinates import EarthLocation, SkyCoord, AltAz
from astropy.time import Time
import astropy.units as u
from astropy.utils.exceptions import AstropyWarning
from astropy.utils.iers import iers
from pyscript import document, display, window

iers.conf.auto_download = False
iers.conf.auto_max_age = None
warnings.simplefilter('ignore', category=AstropyWarning)
warnings.filterwarnings('ignore')

h_meters = 3.0
c = 3.0e8

LAT_DEFAULT = 34.20
LON_DEFAULT = -79.76

TARGET_COORDINATES = {
    "Sgr A*":  {"ra": "17h45m40.0409s", "dec": "-29d00m28.118s", "freq_hz": 20.1e6},
    "M87*":    {"ra": "12h30m49.4234s", "dec": "+12d23m28.043s", "freq_hz": 408.0e6},
    "Cyg A":   {"ra": "19h59m28.3566s", "dec": "+40d44m02.096s", "freq_hz": 1.40e9},
    "Tau A":   {"ra": "05h34m31.9400s", "dec": "+22d00m52.100s", "freq_hz": 1.40e9},
    "Cas A":   {"ra": "23h23m24.0000s", "dec": "+58d48m54.000s", "freq_hz": 80.0e6}
}

state = {}

# Fixed to Eastern Standard Time (EST / UTC-5)
LOCAL_TZ = datetime.timezone(datetime.timedelta(hours=-5))
TZ_NAME = "EST"

def parse_user_date_to_utc(raw_input):
    raw = raw_input.strip()
    if " " in raw:
        date_part, time_part = raw.split(" ", 1)
    else:
        date_part, time_part = raw, "00:00:00"
    
    if "/" in date_part:
        parts = date_part.split("/")
        if len(parts) == 3:
            m, d, y = int(parts[0]), int(parts[1]), int(parts[2])
            date_part = f"{y:04d}-{m:02d}-{d:02d}"
            
    return f"{date_part} {time_part}"

def draw_track(highlight_start_utc=None, highlight_end_utc=None):
    dt_list_utc = state["dt_list_utc"]
    
    # All calculations stay in UTC; datetime list converted to EST for plot display
    dt_list_local = [dt.replace(tzinfo=datetime.timezone.utc).astimezone(LOCAL_TZ) for dt in dt_list_utc]

    alt = state["alt"]
    az = state["az"]
    r_dist = state["r_dist"]
    hourly = state["hourly"]
    lat, lon = state["lat"], state["lon"]
    times_fine_utc = state["times_fine"]
    target_name = state["target_name"]

    document.getElementById("plot1-out").innerHTML = ""
    document.getElementById("plot2-out").innerHTML = ""

    window_mask_fine = None
    if highlight_start_utc is not None:
        window_mask_fine = (times_fine_utc >= highlight_start_utc) & (times_fine_utc <= highlight_end_utc)

    # 1. Polar Track Plot
    fig1 = plt.figure(figsize=(7, 7), facecolor='black')
    ax1 = fig1.add_subplot(111, polar=True, facecolor='#001144')
    ax1.set_theta_zero_location('N')
    ax1.set_theta_direction(-1)
    ax1.set_ylim(0, 90)
    ax1.set_yticks([0, 30, 60, 90])
    ax1.set_yticklabels(['90°', '60°', '30°', '0°'], color='#888888', fontsize=8)
    ax1.grid(color='#4466aa', linestyle='--', linewidth=0.8)
    ax1.set_xticks(np.radians([0, 90, 180, 270]))
    ax1.set_xticklabels(['N', 'E', 'S', 'W'], color='yellow', fontsize=12, fontweight='bold')

    r_plot = r_dist.copy()
    r_plot[alt < 0] = np.nan
    label = 'Full pass' if window_mask_fine is not None else f'{target_name} path'
    ax1.plot(az, r_plot, color='#446688' if window_mask_fine is not None else '#ff7700',
             lw=1.5 if window_mask_fine is not None else 2, alpha=0.6 if window_mask_fine is not None else 1.0,
             label=label)

    if window_mask_fine is not None:
        r_window = r_dist.copy()
        r_window[~(window_mask_fine & (alt >= 0))] = np.nan
        ax1.plot(az, r_window, color='#ff7700', lw=3, label='Observing window')

    for i in np.where(hourly & (alt >= 0))[0]:
        ax1.plot(az[i], r_dist[i], 'o', color='yellow', markersize=4)
        ax1.annotate(dt_list_local[i].strftime('%H:%M'), xy=(az[i], r_dist[i]), xytext=(0, 10),
                     textcoords='offset points', ha='center', color='yellow', fontsize=9)

    ax1.legend(loc='upper right', bbox_to_anchor=(1.35, 1.1), facecolor='black', labelcolor='white', fontsize=8)
    plt.title(f"Sky Track for {target_name}\n({lat:.2f}°, {lon:.2f}°)", color='white', pad=15)
    plt.tight_layout()
    display(fig1, target="plot1-out")
    plt.close(fig1)

    # 2. Altitude vs. Local Time Plot (EST)
    fig2, ax2 = plt.subplots(figsize=(8, 4))
    ax2.plot(dt_list_local, alt, color='#3b82f6', lw=2, label=f'{target_name}')
    ax2.axhline(0, color='red', linestyle='--', label='Horizon')

    if highlight_start_utc is not None:
        start_local = highlight_start_utc.to_datetime(timezone=datetime.timezone.utc).astimezone(LOCAL_TZ)
        end_local = highlight_end_utc.to_datetime(timezone=datetime.timezone.utc).astimezone(LOCAL_TZ)
        ax2.axvspan(start_local, end_local, color='orange', alpha=0.25, label='Your window')

    for i in np.where(hourly & (alt > 0))[0]:
        ax2.annotate(dt_list_local[i].strftime('%H:%M'), (dt_list_local[i], alt[i]),
                     textcoords="offset points", xytext=(0, 6), ha='center', fontsize=8)

    ax2.xaxis.set_major_formatter(mdates.DateFormatter('%H:%M', tz=LOCAL_TZ))
    ax2.xaxis.set_major_locator(mdates.HourLocator(interval=2, tz=LOCAL_TZ))
    ax2.set_xlim(dt_list_local[0], dt_list_local[-1])
    fig2.autofmt_xdate()

    ax2.set_title(f'{target_name} Altitude vs. Eastern Standard Time ({TZ_NAME})', color='white')
    ax2.set_xlabel(f'Local Time ({TZ_NAME})')
    ax2.set_ylabel('Altitude (degrees)')
    ax2.set_ylim(-90, max(max(alt) + 15, 25))
    ax2.fill_between(dt_list_local, alt, 0, where=(alt <= 0), color='gray', alpha=0.3, label='Below Horizon')
    ax2.grid(True, linestyle=':', alpha=0.6)
    ax2.legend(loc='lower right')
    plt.tight_layout()
    display(fig2, target="plot2-out")
    plt.close(fig2)

def show_path(event=None):
    document.getElementById("terminal-out").innerText = "Running astronomical calculations..."
    document.getElementById("window-controls").classList.add("hidden")

    target_name = document.getElementById("targetSelect").value
    raw_date = document.getElementById("dateTimeInput").value
    date_str_utc = parse_user_date_to_utc(raw_date)

    if hasattr(window, 'userLat') and window.userLat is not None and hasattr(window, 'userLon') and window.userLon is not None:
        lat = float(window.userLat)
        lon = float(window.userLon)
    else:
        lat, lon = LAT_DEFAULT, LON_DEFAULT

    location = EarthLocation(lat=lat * u.deg, lon=lon * u.deg, height=0 * u.m)
    coords = TARGET_COORDINATES[target_name]
    target = SkyCoord(ra=coords["ra"], dec=coords["dec"], frame='icrs')
    freq_hz = coords["freq_hz"]

    times_fine_utc = Time(date_str_utc, scale='utc') + np.arange(0, 24 * 60, 1) * u.minute
    dt_list_utc = np.array([t.to_datetime(timezone=datetime.timezone.utc) for t in times_fine_utc])
    
    altaz_fine = target.transform_to(AltAz(obstime=times_fine_utc, location=location))
    alt = altaz_fine.alt.deg
    az = altaz_fine.az.rad
    r_dist = 90 - alt
    hourly = np.array([dt.minute == 0 for dt in dt_list_utc])

    state["target_name"] = target_name
    state["location"] = location
    state["target"] = target
    state["freq_hz"] = freq_hz
    state["lat"] = lat
    state["lon"] = lon
    state["times_fine"] = times_fine_utc
    state["dt_list_utc"] = dt_list_utc
    state["alt"] = alt
    state["az"] = az
    state["r_dist"] = r_dist
    state["hourly"] = hourly

    times_extended_utc = Time(date_str_utc, scale='utc') + np.arange(0, 32 * 60, 1) * u.minute
    altaz_extended = target.transform_to(AltAz(obstime=times_extended_utc, location=location))
    alt_ext = altaz_extended.alt.deg
    dt_ext_utc = np.array([t.to_datetime(timezone=datetime.timezone.utc) for t in times_extended_utc])

    above_horizon_indices = np.where(alt > 0)[0]

    term_text = f" SKY PATH FOR {target_name}\n"
    term_text += f" Target Frequency   : {freq_hz / 1.0e6:.1f} MHz (Auto-selected)\n"
    term_text += f" Observer Location : {lat:.2f}°, {lon:.2f}°\n\n"

    if len(above_horizon_indices) > 0:
        max_alt_idx = np.argmax(alt)
        rise_dt_utc = dt_list_utc[above_horizon_indices[0]]
        peak_dt_utc = dt_list_utc[max_alt_idx]

        rise_local = rise_dt_utc.astimezone(LOCAL_TZ)
        peak_local = peak_dt_utc.astimezone(LOCAL_TZ)

        max_ext_idx = np.argmax(alt_ext)
        post_peak_below = np.where((alt_ext <= 0) & (np.arange(len(alt_ext)) > max_ext_idx))[0]
        
        if len(post_peak_below) > 0:
            set_dt_utc = dt_ext_utc[post_peak_below[0]]
            set_local = set_dt_utc.astimezone(LOCAL_TZ)
            if set_local.day != rise_local.day:
                set_str = f"{set_local.strftime('%H:%M')} {TZ_NAME} (+1 day)"
            else:
                set_str = f"{set_local.strftime('%H:%M')} {TZ_NAME}"
        else:
            set_str = f"--:-- {TZ_NAME}"

        term_text += f"Rises Above Horizon : {rise_local.strftime('%H:%M')} {TZ_NAME} ({rise_dt_utc.strftime('%H:%M')} UTC)\n"
        term_text += f"Peak Altitude       : {alt[max_alt_idx]:.2f}° at {peak_local.strftime('%H:%M')} {TZ_NAME} ({peak_dt_utc.strftime('%H:%M')} UTC)\n"
        term_text += f"Sets Below Horizon  : {set_str}\n\n"
        term_text += "Enter observing window below (UTC) and click Calculate Wire Orientation.\n"
        
        document.getElementById("obsStartInput").value = rise_dt_utc.strftime('%Y-%m-%d %H:%M:%S')
        document.getElementById("obsEndInput").value = peak_dt_utc.strftime('%Y-%m-%d %H:%M:%S')
        
        document.getElementById("window-controls").classList.remove("hidden")
    else:
        term_text += "Target does not rise above horizon during this window.\n"

    document.getElementById("terminal-out").innerText = term_text
    draw_track()

def optimize_window(event=None):
    if "location" not in state:
        document.getElementById("terminal-out").innerText = "Click 'Calculate Horizon Track' first."
        return

    obs_start_str = parse_user_date_to_utc(document.getElementById("obsStartInput").value)
    obs_end_str = parse_user_date_to_utc(document.getElementById("obsEndInput").value)

    try:
        observe_start_utc = Time(obs_start_str, scale='utc')
        observe_end_utc = Time(obs_end_str, scale='utc')
    except Exception:
        document.getElementById("terminal-out").innerText = "Error parsing times. Use format YYYY-MM-DD HH:MM:SS (UTC)."
        return

    location = state["location"]
    target = state["target"]
    target_name = state["target_name"]
    freq_hz = state["freq_hz"]
    lat, lon = state["lat"], state["lon"]

    times_utc = observe_start_utc + np.arange(0, max(1, int((observe_end_utc - observe_start_utc).to(u.minute).value)), 5) * u.minute
    altaz = target.transform_to(AltAz(obstime=times_utc, location=location))

    visible_mask = altaz.alt.deg > 0

    start_dt_local = observe_start_utc.to_datetime(timezone=datetime.timezone.utc).astimezone(LOCAL_TZ)
    end_dt_local = observe_end_utc.to_datetime(timezone=datetime.timezone.utc).astimezone(LOCAL_TZ)

    term_text = f" OPTIMAL WIRE ORIENTATION FOR {target_name} DURING YOUR OBSERVING WINDOW\n"
    term_text += f" Target Frequency   : {freq_hz / 1.0e6:.1f} MHz (Auto-selected)\n"
    term_text += f" Observer Location : {lat:.2f}°, {lon:.2f}°\n"
    term_text += f" Window (EST)      : {start_dt_local.strftime('%Y-%m-%d %H:%M')} to {end_dt_local.strftime('%H:%M EST')}\n"
    term_text += f" Window (UTC)      : {observe_start_utc.iso} to {observe_end_utc.iso}\n\n"

    if not np.any(visible_mask):
        term_text += f"WARNING: {target_name} is NOT above the horizon during your chosen observing window.\n"
        document.getElementById("terminal-out").innerText = term_text
        return

    sgr_az_rad = altaz.az.rad[visible_mask]
    sgr_elev_rad = altaz.alt.rad[visible_mask]

    wavelength = c / freq_hz
    h_over_lambda = h_meters / wavelength
    ground_factor = np.sin(2 * np.pi * h_over_lambda * np.sin(sgr_elev_rad))**2

    best_score = -1.0
    best_w1_angle = 0
    best_w2_angle = 90

    for w1_deg in range(0, 90, 5):
        w1_rad = np.radians(w1_deg)
        w2_rad = np.radians(w1_deg + 90)

        cos_theta1 = np.cos(sgr_elev_rad) * np.cos(sgr_az_rad - w1_rad)
        cos_theta2 = np.cos(sgr_elev_rad) * np.cos(sgr_az_rad - w2_rad)

        power_w1 = (1.0 - cos_theta1**2) * ground_factor
        power_w2 = (1.0 - cos_theta2**2) * ground_factor

        score = np.sum(np.maximum(power_w1, power_w2))

        if score > best_score:
            best_score = score
            best_w1_angle = w1_deg
            best_w2_angle = w1_deg + 90

    term_text += f" Target Alt Range in Window: {np.min(altaz.alt.deg[visible_mask]):.1f}° to {np.max(altaz.alt.deg[visible_mask]):.1f}°\n\n"
    term_text += f" BEST SETUP FOUND \n"
    term_text += f" Wire 1 Angle    : {best_w1_angle}° from North\n"
    term_text += f" Wire 2 Angle    : {best_w2_angle}° from North\n"

    document.getElementById("terminal-out").innerText = term_text
    draw_track(highlight_start_utc=observe_start_utc, highlight_end_utc=observe_end_utc)

document.getElementById("terminal-out").innerText = "Detecting location... Select target, date, and click 'Calculate Horizon Track'."
  </script>
</body>
